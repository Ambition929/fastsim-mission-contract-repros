              op3_e_r_joint24: -0.045580314174718445
              op3_e_r_joint26: -0.045589007522000145
              op3_e_r_joint27: 0.04567914181882933
              op3_e_r_joint28: 0.0
            name: open
            robot: g2
            solver_profile: finger_right_actuate
        next:
          success:
          - box_right_settled
      box_right_settled:
        kind: evaluation
        metric_id: box_right_slow
        mode: check
        next:
          success:
          - box_right_angular_settled
          failure:
          - failed
      box_right_angular_settled:
        kind: evaluation
        metric_id: box_right_upright
        mode: check
        next:
          success:
          - box_right_verify_position
          failure:
          - failed
      box_right_verify_position:
        kind: evaluation
        metric_id: box_right_placed
        mode: check
        next:
          success:
          - box_right_verify_orientation
          failure:
          - failed
      box_right_verify_orientation:
        kind: evaluation
        metric_id: box_right_upright
        mode: check
        next:
          success:
          - final_box_left_position
          failure:
          - failed
      final_box_left_position:
        kind: evaluation
        metric_id: box_left_placed
        mode: check
        next:
          success:
          - final_box_left_orientation
          failure:
          - failed
      final_box_left_orientation:
        kind: evaluation
        metric_id: box_left_upright
        mode: check
        next:
          success:
          - final_box_left_slow
          failure:
          - failed
      final_box_left_slow:
        kind: evaluation
        metric_id: box_left_slow
        mode: check
        next:
          success:
          - final_box_right_position
          failure:
          - failed
      final_box_right_position:
        kind: evaluation
        metric_id: box_right_placed
        mode: check
        next:
          success:
          - done
          failure:
          - failed
      done:
        kind: success
      failed:
        kind: fail
        code: CARDBOARD_PLACEMENT_FAILED
        message: A box was not physically lifted, released, and settled in its assigned
          top-shelf slot.
      preposition_left:
        kind: action
        action:
          type: custom
          robot: g2
          motions:
          - kind: joints
            name: preposition
            robot: g2
            solver_profile: finger
            joints:
              op3_e_joint12: 0.005
              op3_e_joint22: -0.005
        next:
          success:
          - box_left_above
  evaluation:
    schema: mission-evaluation/2
    metrics:
      box_left_lifted:
        kind: position_error
        entity_id: objects.box_left
        target:
        - 5.55
        - 4.05
        - 0.775
        tolerance: 0.012
      box_left_placed:
        kind: position_error
        entity_id: objects.box_left
        target:
        - 6.019999920141844
        - 4.0649999999999595
        - 1.115
        tolerance: 0.012
      box_left_upright:
        kind: orientation_error
        entity_id: objects.box_left
        target:
        - 0.0
        - 0.0
        - -0.707106428259938
        - 0.707107134112981
        tolerance: 0.1
      box_left_slow:
        kind: linear_speed
        entity_id: objects.box_left
        tolerance: 0.008
      box_right_lifted:
        kind: position_error
        entity_id: objects.box_right
        target:
        - 5.55
        - 3.75
        - 0.775
        tolerance: 0.012
      box_right_placed:
        kind: position_error
        entity_id: objects.box_right
        target:
        - 6.020000079858155
        - 3.9050000000000393
        - 1.115
        tolerance: 0.012
      box_right_upright:
        kind: orientation_error
        entity_id: objects.box_right
        target:
        - 0.0
        - 0.0
        - -0.707106428259938
        - 0.707107134112981
        tolerance: 0.1
      box_right_slow:
        kind: linear_speed
        entity_id: objects.box_right
        tolerance: 0.008
      base_locked:
        kind: position_error
        entity_id: robots.g2
        target:
        - 5.010561442205941
        - 3.914999144974836
        - 0.04
        tolerance: 0.001
    report:
      boundary: execution_end
      metrics:
      - box_left_placed
      - box_left_upright
      - box_left_slow
      - box_right_placed
      - box_right_upright
      - box_right_slow
      - base_locked
      aggregate:
        weights: {}
        require_pass:
        - box_left_placed
        - box_left_upright
        - box_left_slow
        - box_right_placed
        - box_right_upright
        - box_right_slow
        - base_locked
        missing: error
control:
  default_robot: g2
  precedence:
  - mission
plugins:
  mission:
    use: plugin://fastsim/mission
    bindings:
      g2: g2
    session:
      heartbeat:
        timeout_s: 30.0
      lease:
        timeout_s: 600.0
      freshness:
        max_observation_age_sim_s: 0.25
    config:
      motion_timeout_s: 900.0
      world_capture:
        enabled: true
        geometry: true
      checkpoint:
        enabled: false
      robots:
        g2:
          model: asset://robot_open110.yaml
          tool_frames:
          - op3_e_base_link
          - op3_e_r_base_link
          limits:
            acceleration: 4.0
            jerk: 60.0
      solvers:
        left:
          robot: g2
          solver: asset://solver_dual_payload.yaml
          motion:
            lock_joints:
              except:
              - idx21_arm_l_joint1
              - idx22_arm_l_joint2
              - idx23_arm_l_joint3
              - idx24_arm_l_joint4
              - idx25_arm_l_joint5
              - idx26_arm_l_joint6
              - idx27_arm_l_joint7
        right:
          robot: g2
          solver: asset://solver_dual_payload.yaml
          motion:
            lock_joints:
              except:
              - idx61_arm_r_joint1
              - idx62_arm_r_joint2
              - idx63_arm_r_joint3
              - idx64_arm_r_joint4
              - idx65_arm_r_joint5
              - idx66_arm_r_joint6
              - idx67_arm_r_joint7
        finger:
          robot: g2
          solver: asset://solver_dual_payload.yaml
          motion:
            lock_joints:
              except:
              - op3_e_joint12
              - op3_e_joint22
        finger_left_actuate:
          robot: g2
          solver: asset://solver_dual_payload.yaml
          motion:
            lock_joints:
              except:
              - op3_e_joint1
              - op3_e_joint12
              - op3_e_joint13
              - op3_e_joint14
              - op3_e_joint16
              - op3_e_joint17
              - op3_e_joint18
              - op3_e_joint22
              - op3_e_joint23
              - op3_e_joint24
              - op3_e_joint26
              - op3_e_joint27
              - op3_e_joint28
        finger_right_actuate:
          robot: g2
          solver: asset://solver_dual_payload.yaml
          motion:
            lock_joints:
              except:
              - op3_e_r_joint1
              - op3_e_r_joint12
              - op3_e_r_joint13
              - op3_e_r_joint14
              - op3_e_r_joint16
              - op3_e_r_joint17
              - op3_e_r_joint18
              - op3_e_r_joint22
              - op3_e_r_joint23
              - op3_e_r_joint24
              - op3_e_r_joint26
              - op3_e_r_joint27
              - op3_e_r_joint28
      blueprint:
        require_evaluation_pass: true
      debug_draw: false
  record:
    use: plugin://fastsim/record
    config:
      streams:
        observations:
          mode: none
          include: {}
        render_state:
          enabled: true
          rate_hz: 30
